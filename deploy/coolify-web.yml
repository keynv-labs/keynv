# Coolify-friendly compose for keynv-web (Next.js dashboard).
#
# Deploy this as a SECOND Coolify resource, separate from keynv-server.
# In Coolify: New Resource → Docker Compose Empty → "From Git Repository"
# → point at this file (`deploy/coolify-web.yml`).
#
# The web app needs to know where the API lives. KEYNV_SERVER_URL must
# be the public HTTPS URL of the keynv-server resource (from coolify.yml).
# Typical layout:
#   keynv.dev          → keynv-web   (this resource, port 3000)
#   api.keynv.dev      → keynv-server (the other resource, port 8080)
#
# Both resources share zero state. The web app talks to the server via
# the public HTTPS URL just like the CLI does — the only difference is
# that web uses a session cookie wrapping the access token instead of
# carrying the token through every request manually.

name: keynv-web

services:
  keynv-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Public URL of the keynv-server resource. Required.
      KEYNV_SERVER_URL: ${KEYNV_SERVER_URL}
      # 32+ char random string. Encrypts the session cookie payload so
      # the access token doesn't sit in plaintext on the user's disk.
      # Generate: openssl rand -base64 48
      KEYNV_WEB_SESSION_SECRET: ${KEYNV_WEB_SESSION_SECRET}
      NODE_ENV: production
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/login || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
