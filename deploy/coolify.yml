# Coolify one-resource deploy for keynv — server + web dashboard.
#
# In Coolify: New Resource → Docker Compose Empty (or "From Git
# Repository") → point at this file (`deploy/coolify.yml`). Coolify
# reads the compose, exposes env-var slots in its UI, and routes a
# domain to each service.
#
# The ONLY values you must set are the first-deploy owner account:
#   KEYNV_BOOTSTRAP_OWNER_EMAIL
#   KEYNV_BOOTSTRAP_OWNER_PASSWORD   (>= 12 chars)
# Everything else — the JWT secret, the master key, the web session
# secret — is auto-generated and persisted on the volumes on first
# boot. No secret to generate, no crash-loop.
#
# Domains (Coolify → each service → Domains tab):
#   keynv-web    → https://<your-domain>        (port 3000)  ← the panel
#   keynv-server → https://api.<your-domain>    (port 8080)  ← the API/CLI
# Set KEYNV_WEB_URL to the web domain and point the web's
# KEYNV_SERVER_URL at the server domain if you split them across hosts;
# on a single host the in-network default below is enough.
#
# Litestream (S3 backup) is intentionally NOT here — add it later as a
# separate resource if you need offsite disaster recovery.

name: keynv

services:
  keynv-server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      KEYNV_DB_PATH: /data/keynv.db
      KEYNV_MASTER_KEY_FILE: /data/master.key
      KEYNV_JWT_SECRET_FILE: /data/jwt.secret
      KEYNV_JWT_SECRET: ${KEYNV_JWT_SECRET:-}
      KEYNV_LOG_LEVEL: ${KEYNV_LOG_LEVEL:-info}
      KEYNV_PORT: 8080
      KEYNV_WEB_URL: ${KEYNV_WEB_URL:-}
      KEYNV_BOOTSTRAP_OWNER_EMAIL: ${KEYNV_BOOTSTRAP_OWNER_EMAIL:-}
      KEYNV_BOOTSTRAP_OWNER_PASSWORD: ${KEYNV_BOOTSTRAP_OWNER_PASSWORD:-}
      KEYNV_BOOTSTRAP_ORG_NAME: ${KEYNV_BOOTSTRAP_ORG_NAME:-default}
      KEYNV_PUBLIC_REGISTRATION: ${KEYNV_PUBLIC_REGISTRATION:-false}
      KEYNV_RATE_LIMIT_PER_MINUTE: ${KEYNV_RATE_LIMIT_PER_MINUTE:-120}
    volumes:
      - keynv-data:/data
    expose:
      - '8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/v1/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  keynv-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      KEYNV_SERVER_URL: ${KEYNV_SERVER_URL:-http://keynv-server:8080}
      KEYNV_WEB_SESSION_SECRET: ${KEYNV_WEB_SESSION_SECRET:-}
      KEYNV_WEB_SESSION_SECRET_FILE: /data/web-session.secret
    volumes:
      - keynv-web-data:/data
    expose:
      - '3000'
    depends_on:
      keynv-server:
        condition: service_healthy

volumes:
  keynv-data:
  keynv-web-data:
