# Coolify-friendly compose for keynv-server.
#
# In Coolify: New Resource → Docker Compose Empty (or "From Git Repository")
# → point at this file (`deploy/coolify.yml`). Coolify reads the compose,
# exposes env-var slots in its UI, and routes its $SERVICE_FQDN_KEYNVSERVER
# magic domain to the service.
#
# This is the SERVER ONLY. Litestream (S3 backup) and the web UI are
# intentionally separate so day-one deploy stays simple. Add them as
# additional Coolify resources later when you actually need them.

name: keynv

services:
  keynv-server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      KEYNV_DB_PATH: /data/keynv.db
      KEYNV_MASTER_KEY_FILE: /data/master.key
      KEYNV_JWT_SECRET: ${KEYNV_JWT_SECRET}
      KEYNV_LOG_LEVEL: ${KEYNV_LOG_LEVEL:-info}
      KEYNV_PORT: 8080
      # First-deploy auto-bootstrap. Set these in Coolify's env-var UI
      # for the very first deploy; the server creates master.key + the
      # owner account on startup. After it succeeds, blank these out
      # and redeploy — they're no-ops once master.key exists.
      KEYNV_BOOTSTRAP_OWNER_EMAIL: ${KEYNV_BOOTSTRAP_OWNER_EMAIL:-}
      KEYNV_BOOTSTRAP_OWNER_PASSWORD: ${KEYNV_BOOTSTRAP_OWNER_PASSWORD:-}
      KEYNV_BOOTSTRAP_ORG_NAME: ${KEYNV_BOOTSTRAP_ORG_NAME:-default}
      # Public registration toggle. Self-host: leave at false (or unset);
      # invite users via /admin/users. Hosted Cloud (keynv.dev): set true.
      KEYNV_PUBLIC_REGISTRATION: ${KEYNV_PUBLIC_REGISTRATION:-false}
      KEYNV_REGISTER_RATE_LIMIT_PER_MINUTE: ${KEYNV_REGISTER_RATE_LIMIT_PER_MINUTE:-5}
      KEYNV_RATE_LIMIT_PER_MINUTE: ${KEYNV_RATE_LIMIT_PER_MINUTE:-120}
      KEYNV_WEB_URL: ${KEYNV_WEB_URL:-https://keynv.dev}
    volumes:
      - keynv-data:/data
    expose:
      - '8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  keynv-data:
