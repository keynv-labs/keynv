<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="keynv — 62,311 secrets leaked on one dev machine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#060912"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#F59E0B"/>

  <!-- brand: logomark chip (scaled from the app's 32px logomark) + wordmark -->
  <g transform="translate(80,74)">
    <g transform="scale(1.6)">
      <rect width="32" height="32" rx="6" fill="#111827"/>
      <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#3F2D12"/>
      <path d="M9 7 L9 25 M9 17 L17 9 M9 17 L17 25" fill="none" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="square"/>
      <circle cx="22.5" cy="9.5" r="1.5" fill="#F59E0B"/>
    </g>
    <text x="70" y="36" class="sans" font-size="30" font-weight="600" fill="#E2E8F0" letter-spacing="-0.5">keynv</text>
  </g>

  <!-- headline -->
  <text x="80" y="300" class="sans" font-size="104" font-weight="800" letter-spacing="-2" fill="#F8FAFC">
    <tspan fill="#F59E0B">62,311</tspan><tspan fill="#F8FAFC" dx="26">secrets</tspan>
  </text>
  <text x="80" y="392" class="sans" font-size="64" font-weight="700" letter-spacing="-1" fill="#F8FAFC">leaked on one dev machine.</text>

  <!-- accent underline -->
  <rect x="82" y="420" width="300" height="5" rx="2.5" fill="#F59E0B"/>

  <!-- subhead -->
  <text x="80" y="486" class="sans" font-size="29" fill="#94A3B8">keynv keeps secrets out of your shell history, terminal output, and</text>
  <text x="80" y="524" class="sans" font-size="29" fill="#94A3B8">AI agent transcripts — in real time, on your machine.</text>

  <!-- footer -->
  <text x="80" y="588" class="mono" font-size="24" fill="#64748B">github.com/keynv-labs/keynv<tspan fill="#334155">   ·   </tspan><tspan fill="#F59E0B">MIT</tspan><tspan fill="#334155">   ·   </tspan>local-first</text>
</svg>
