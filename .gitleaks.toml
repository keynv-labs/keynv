# gitleaks config — extends the default ruleset.
# Allowlist for fixtures and docs that contain example-shaped tokens.

[extend]
useDefault = true

[allowlist]
description = "keynv allowlist for documentation examples and clearly-fake fixtures"
paths = [
  # All Markdown docs (engineering + public-facing) carry example tokens
  # in their pattern-bank tables; these are illustrations, not secrets.
  '''docs/.*\.md$''',
  '''apps/docs/src/content/docs/.*\.md$''',

  # The redactor's own pattern source + test fixtures intentionally
  # contain every supported secret-shape so the pattern bank can be
  # regression-tested. patterns.ts contains the regex literals that
  # define what a private-key block looks like (BEGIN/END markers
  # appear verbatim in the source); the default gitleaks `private-key`
  # rule false-positives on those literals. Real values never live in
  # this directory — see the inline negative corpus assertions in
  # patterns.test.ts.
  '''packages/redactor/src/patterns\.ts$''',
  '''packages/redactor/src/.*\.test\.ts$''',

  # Test fixtures explicitly named "innocent" or "*.example.*"
  '''.*test/fixtures/innocent.*$''',
  '''.*\.example\..*$''',

  # Server integration tests use throwaway in-memory fixtures.
  '''apps/server/src/test/.*\.test\.ts$''',

  # End-to-end security regression suite. Fixtures are vendor-shaped
  # placeholders + a clearly-fake RSA private-key block (only the
  # BEGIN/END markers and a few literal-fake bytes); intentional
  # negative corpus that the redactor must mask.
  '''tests/security/src/.*\.test\.ts$''',

  # Spike/benchmark scripts deliberately allocate fake secrets to
  # measure encrypt/decrypt throughput.
  '''scripts/spikes/src/.*\.ts$''',
]
regexes = [
  # Clearly-fake placeholders we ship in docs and CLI examples.
  '''example-fake-(?:token|key|password|secret|pass)''',
  '''supersecret123''',
  '''super-secret-value''',
  '''sk-(?:proj-)?example''',
  '''AKIAEXAMPLE''',

  # Helm-lint stub jwtSecret that just needs to be ≥32 chars long.
  '''test-jwt-secret-must-be-at-least-32-chars''',

  # Owner password printed in the docs walkthrough — clearly a
  # placeholder, instructing the reader to choose their own.
  '''choose-a-strong-12-plus-char-password''',
  '''your-12-plus-char-password''',
  '''owner-password-12345''',
  '''developer-password-12345''',

  # Web's local-dev autofill default for the login form. NODE_ENV is
  # inlined at build time; the constant is null in production builds.
  '''bir-uzun-12-plus-parola''',

  # Alphabet used by the temp-password generator in /admin/users
  # InviteUserDialog — the no-look-alike charset (I/l/0/O/1 omitted).
  # Not a secret; just a constant character set.
  '''ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789''',
]
