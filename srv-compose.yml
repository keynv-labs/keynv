name: keynv-stack
services:
  keynv-server:
    build:
      context: ../repo
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KEYNV_DB_PATH: /data/keynv.db
      KEYNV_MASTER_KEY_FILE: /data/master.key
      KEYNV_PORT: 8080
    ports:
      - "127.0.0.1:${KEYNV_API_PORT}:8080"
    volumes:
      - keynv-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  keynv-web:
    build:
      context: ../repo
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${KEYNV_WEB_PORT}:3000"
    depends_on:
      - keynv-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  keynv-data:
