name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist on origin.'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/keynv-server

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          # Mark anything with a hyphen (rc, beta, alpha, dev) as prerelease.
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  security-gate:
    name: security gate
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Blocks the release on moderate+ advisories. For an advisory with no
      # available fix and no exploitable path in keynv, add its GHSA/CVE id to
      # pnpm.auditConfig.ignoreCves (with a tracking issue) so a transitive
      # upstream advisory can't permanently block shipping.
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

  cli-binaries:
    name: cli (${{ matrix.target }})
    needs: [prepare, security-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            os: macos-14
            artifact: keynv-darwin-arm64
          - target: bun-darwin-x64
            os: macos-15-intel
            artifact: keynv-darwin-x64
          - target: bun-linux-x64
            os: ubuntu-latest
            artifact: keynv-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-24.04-arm
            artifact: keynv-linux-arm64
          - target: bun-windows-x64
            os: windows-latest
            artifact: keynv-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      # CLI depends on workspace packages; build their JS so Bun can
      # compile against real dist/ outputs rather than walking sources.
      - run: pnpm -r --filter '!@keynv/cli' --filter '!@keynv/web' build
      - name: Build CLI binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cd apps/cli
          # ssh2 + cpu-features are native modules that ship via
          # node-gyp at install time and have no pre-built artifact
          # `cpu-features/build/Release/cpufeatures.node` for Bun's
          # static analysis to embed. Mark them external so Bun skips
          # them; the SSH tester already uses `await import('ssh2')`
          # and falls back to a clean error result if the module is
          # not resolvable at runtime. Other testers (postgres,
          # mysql, redis, http) are pure JS and bundle fine.
          bun build src/index.ts \
            --compile \
            --target ${{ matrix.target }} \
            --external ssh2 \
            --external cpu-features \
            --outfile "../../dist-release/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-release/${{ matrix.artifact }}
          retention-days: 1
          if-no-files-found: error

  npm-publish:
    name: npm (@keynv/cli)
    needs: [prepare, security-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # Sync package versions with the git tag (tag is the source of truth).
      # No commit, no tag — just rewrite package.json files in place for the build.
      - name: Sync package versions with tag
        run: pnpm version:sync "${{ needs.prepare.outputs.version }}"
      # Workspace deps must be built so tsup can bundle them.
      - run: pnpm -r --filter '!@keynv/cli' --filter '!@keynv/web' build
      - run: pnpm --filter @keynv/cli build
      - name: Verify built CLI version
        working-directory: apps/cli
        run: |
          set -euo pipefail
          actual="$(node dist/index.js --version)"
          test "$actual" = "${{ needs.prepare.outputs.version }}"
      - name: Verify npm auth
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "npm registry: $(npm config get registry)"
          echo "authenticated user: $(npm whoami)"
      - name: Publish @keynv/cli to npm
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            npm publish --access public --tag next --provenance
          else
            npm publish --access public --provenance
          fi
      - name: Promote @keynv/cli dist-tag to latest
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm dist-tag add @keynv/cli@${{ needs.prepare.outputs.version }} latest
      - name: Verify published npm CLI version
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          for i in $(seq 1 12); do
            if npm view "@keynv/cli@$version" version >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = "12" ]; then
              echo "@keynv/cli@$version is not visible on npm" >&2
              exit 1
            fi
            sleep 10
          done
          actual="$(npm exec --yes --package "@keynv/cli@$version" -- keynv --version)"
          test "$actual" = "$version"

  npm-publish-libs:
    name: npm (@keynv/core, redactor, testers)
    needs: [prepare, security-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Sync package versions with tag
        run: pnpm version:sync "${{ needs.prepare.outputs.version }}"
      - run: pnpm -r --filter '!@keynv/cli' --filter '!@keynv/web' build
      # The shared libraries are consumed by the separate keynv-mcp repo, so
      # they are published here. pnpm publish rewrites @keynv/testers'
      # workspace:* deps to the released versions (plain npm publish would not).
      - name: Publish libraries to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Tag latest so a bare `npm i @keynv/core` resolves (the released
          # version is the current one); the keynv-mcp repo pins exact ranges.
          pnpm --filter @keynv/core --filter @keynv/redactor --filter @keynv/testers publish \
            --access public --no-git-checks --provenance --tag latest
      - name: Verify published library versions
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          for pkg in @keynv/core @keynv/redactor @keynv/testers; do
            for i in $(seq 1 12); do
              if npm view "$pkg@$version" version >/dev/null 2>&1; then break; fi
              if [ "$i" = "12" ]; then echo "$pkg@$version not visible on npm" >&2; exit 1; fi
              sleep 10
            done
          done

  docker-image:
    name: docker (multi-arch)
    needs: [prepare, security-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` only on stable releases (no rc/beta/alpha suffix).
          # Pre-1.0 also gets the {major}.{minor} alias so a user can
          # pin to e.g. `0.1` and follow patches automatically.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign Docker image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
      - name: Generate Docker SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: keynv-server-image.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: keynv-server-image-sbom
          path: keynv-server-image.spdx.json
          retention-days: 1
          if-no-files-found: error

  release:
    name: github release
    needs: [prepare, cli-binaries, npm-publish, docker-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
          # Skip the docker provenance artifact (keynv-labs~keynv~*.dockerbuild)
          # uploaded by docker/build-push-action; keep CLI binaries and SBOMs.
          pattern: keynv-*-*
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist-release/keynv-source.spdx.json
          upload-artifact: false
      - name: Compute SHA256SUMS
        working-directory: dist-release
        run: |
          set -euo pipefail
          # Sort for deterministic ordering across re-runs. Signatures are
          # generated after this step and intentionally excluded.
          ls keynv-* | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign release artifacts
        working-directory: dist-release
        run: |
          set -euo pipefail
          for file in keynv-* SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              "$file"
          done
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          # Pull the section between `## [version]` and the next `## [`
          # header. Strip the section heading itself; keep the body.
          awk -v ver="$version" '
            /^## \[/ {
              if (capture) exit
              if ($0 ~ "\\["ver"\\]") { capture=1; next }
            }
            capture { print }
          ' CHANGELOG.md > release-body.md
          if [ -s release-body.md ]; then
            echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG section found for $version — falling back to autogen." >&2
            rm -f release-body.md
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          # If we extracted a CHANGELOG section, use it; otherwise let
          # GitHub auto-generate from PRs/commits.
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          files: |
            dist-release/keynv-*
            dist-release/SHA256SUMS
            dist-release/SHA256SUMS.sig
            dist-release/SHA256SUMS.pem
