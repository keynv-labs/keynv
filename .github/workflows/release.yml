name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist on origin.'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/keynv-server

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          # Mark anything with a hyphen (rc, beta, alpha, dev) as prerelease.
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  cli-binaries:
    name: cli (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            os: macos-14
            artifact: keynv-darwin-arm64
          - target: bun-linux-x64
            os: ubuntu-latest
            artifact: keynv-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-24.04-arm
            artifact: keynv-linux-arm64
          - target: bun-windows-x64
            os: windows-latest
            artifact: keynv-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      # CLI depends on workspace packages; build their JS so Bun can
      # compile against real dist/ outputs rather than walking sources.
      - run: pnpm -r --filter '!@keynv/cli' --filter '!@keynv/web' build
      - name: Build CLI binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cd apps/cli
          # ssh2 + cpu-features are native modules that ship via
          # node-gyp at install time and have no pre-built artifact
          # `cpu-features/build/Release/cpufeatures.node` for Bun's
          # static analysis to embed. Mark them external so Bun skips
          # them; the SSH tester already uses `await import('ssh2')`
          # and falls back to a clean error result if the module is
          # not resolvable at runtime. Other testers (postgres,
          # mysql, redis, http) are pure JS and bundle fine.
          bun build src/index.ts \
            --compile \
            --target ${{ matrix.target }} \
            --external ssh2 \
            --external cpu-features \
            --outfile "../../dist-release/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-release/${{ matrix.artifact }}
          retention-days: 1
          if-no-files-found: error

  npm-publish:
    name: npm (@keynv/cli)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # Sync the published version with the git tag (tag is the source of
      # truth). No commit, no tag — just rewrite package.json in place.
      - name: Sync @keynv/cli version with tag
        working-directory: apps/cli
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      # Workspace deps must be built so tsup can bundle them.
      - run: pnpm -r --filter '!@keynv/cli' --filter '!@keynv/web' build
      - run: pnpm --filter @keynv/cli build
      - name: Publish to npm
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            npm publish --access public --tag next --provenance || true
            npm dist-tag add @keynv/cli@${{ needs.prepare.outputs.version }} latest
          else
            npm publish --access public --provenance
            npm dist-tag add @keynv/cli@${{ needs.prepare.outputs.version }} latest
          fi

  docker-image:
    name: docker (multi-arch)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` only on stable releases (no rc/beta/alpha suffix).
          # Pre-1.0 also gets the {major}.{minor} alias so a user can
          # pin to e.g. `0.1` and follow patches automatically.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: github release
    needs: [prepare, cli-binaries, npm-publish, docker-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
          # Skip the docker provenance artifact (keynv-labs~keynv~*.dockerbuild)
          # uploaded by docker/build-push-action; we only want CLI binaries.
          pattern: keynv-*-*
      - name: Compute SHA256SUMS
        working-directory: dist-release
        run: |
          set -euo pipefail
          # Sort for deterministic ordering across re-runs.
          ls keynv-* | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          # Pull the section between `## [version]` and the next `## [`
          # header. Strip the section heading itself; keep the body.
          awk -v ver="$version" '
            /^## \[/ {
              if (capture) exit
              if ($0 ~ "\\["ver"\\]") { capture=1; next }
            }
            capture { print }
          ' CHANGELOG.md > release-body.md
          if [ -s release-body.md ]; then
            echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG section found for $version — falling back to autogen." >&2
            rm -f release-body.md
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          # If we extracted a CHANGELOG section, use it; otherwise let
          # GitHub auto-generate from PRs/commits.
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          files: |
            dist-release/keynv-*
            dist-release/SHA256SUMS
