name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # nightly at 03:17 UTC
    - cron: '17 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisory only: a brand-new upstream advisory (often with no fix yet)
      # must not turn `main` red on every push/PR/nightly with zero code
      # changes. The release pipeline's security-gate is where audit blocks,
      # and it honors pnpm.auditConfig.ignoreCves for curated exceptions.
      - run: pnpm audit --audit-level moderate
        continue-on-error: true

  codeql:
    name: codeql (javascript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
