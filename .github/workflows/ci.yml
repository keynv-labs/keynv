name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build workspace deps so cross-package types resolve (e.g.
      # @keynv/redactor's dist/ types are needed by apps/server).
      # CLI is excluded because it relies on Bun's --compile; web is
      # excluded because Next.js handles its own typecheck pass.
      - run: pnpm -r --filter '!@keynv/cli' --filter '!@keynv/web' build
      - run: pnpm typecheck

  test:
    name: test (${{ matrix.os }} / node-${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!@keynv/cli' --filter '!@keynv/web' build
      - run: pnpm test

  bundle-smoke:
    name: bundle smoke (published binaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build workspace deps so tsup can bundle them into the published bins.
      # This also builds apps/mcp (it is not excluded).
      - run: pnpm -r --filter '!@keynv/cli' --filter '!@keynv/web' build
      # The @keynv/cli bundle is the artifact users actually install, but it is
      # otherwise only built at release time — so a tsup bundling regression
      # (missing noExternal entry, broken shebang, an eager native import)
      # would ship to npm with the rest of CI green. Build + run it here.
      - name: Build and smoke-test the @keynv/cli bundle
        run: |
          set -euo pipefail
          pnpm --filter @keynv/cli build
          head -1 apps/cli/dist/index.js | grep -q '^#!/usr/bin/env node'
          node apps/cli/dist/index.js --version
          node apps/cli/dist/index.js --help >/dev/null
          node apps/cli/dist/index.js doctor --help >/dev/null
      - name: Verify the @keynv/mcp bundle
        run: |
          set -euo pipefail
          test -f apps/mcp/dist/index.js
          head -1 apps/mcp/dist/index.js | grep -q '^#!/usr/bin/env node'

  e2e:
    name: e2e (playwright / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm -r --filter '!@keynv/cli' --filter '!@keynv/web' build
      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @keynv/tests-e2e exec playwright install-deps chromium
      - name: Install Playwright browsers
        run: pnpm --filter @keynv/tests-e2e exec playwright install chromium
      - name: Run E2E tests
        run: pnpm test:e2e

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks-action wrapper requires a paid license for org
      # accounts; the underlying gitleaks binary is OSS and works
      # fine. Install via the official tarball + run with the
      # committed config.
      - name: Install gitleaks
        run: |
          set -e
          GL_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan committed history
        run: gitleaks git -v --redact

  build-web:
    name: build (next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '!@keynv/cli' --filter '!@keynv/web' build
      - run: pnpm --filter @keynv/web build
